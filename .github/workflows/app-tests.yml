name: Sample App Tests

on:
  push:
  pull_request:

jobs:
  sample_app_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: 2_tds/td5/scripts/sample-app
        run: npm install

      - name: Run tests
        working-directory: 2_tds/td5/scripts/sample-app
        run: npm test
