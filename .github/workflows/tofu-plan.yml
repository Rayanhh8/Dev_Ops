name: tofu-plan

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "2_tds/td5/scripts/tofu/**"
      - ".github/workflows/tofu-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: 2_tds/td5/scripts/tofu/live/lambda-sample

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PLAN_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.2


      - name: Init
        run: tofu init -reconfigure

      - name: Plan
        id: plan
        env:
          TF_VAR_name: "lambda-sample-pr-${{ github.event.number }}"
        run: |
          tofu plan -no-color | tee plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('2_tds/td5/scripts/tofu/live/lambda-sample/plan.txt', 'utf8');
            const max = 65000;
            const trimmed = body.length > max ? body.slice(0, max) + "\n\n...trimmed..." : body;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "## OpenTofu plan\n```text\n" + trimmed + "\n```"
            });
