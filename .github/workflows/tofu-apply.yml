name: tofu-apply

on:
  push:
    branches: [ "main" ]
    paths:
      - "2_tds/td5/scripts/tofu/**"
      - ".github/workflows/tofu-apply.yml"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest

    # IMPORTANT: requires a GitHub Environment named "aws-apply" with required reviewers
    environment: aws-apply

    defaults:
      run:
        shell: bash
        working-directory: 2_tds/td5/scripts/tofu/live/lambda-sample

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.APPLY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.2


      - name: Init
        run: tofu init -reconfigure

      - name: Apply
        env:
          TF_VAR_name: "lambda-sample-main"
        run: tofu apply -auto-approve
