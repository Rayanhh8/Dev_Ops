name: Tofu Apply

on:
  push:
    branches: ["main"]
    paths:
      - "2_tds/td5/scripts/tofu/live/lambda-sample/**"
      - ".github/workflows/tofu-apply.yml"

permissions:
  pull-requests: write
  id-token: write
  contents: read

jobs:
  apply:
    name: "Tofu Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::968196829199:role/lambda-sample-apply
          role-session-name: apply-${{ github.run_number }}-${{ github.actor }}
          aws-region: us-east-2

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.11.2

      - name: Tofu apply
        id: apply
        working-directory: 2_tds/td5/scripts/tofu/live/lambda-sample
        env:
          TF_VAR_name: "lambda-sample-ci-${{ github.run_id }}"
        run: |
          tofu init -no-color -input=false
          tofu apply -no-color -input=false -lock-timeout=60m -auto-approve

      - name: Find current PR
        uses: jwalton/gh-find-current-pr@master
        id: find_pr
        with:
          state: all

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        if: steps.find_pr.outputs.number
        env:
          RESULT_EMOJI: ${{ steps.apply.outcome == 'success' && '✅' || '⚠️' }}
        with:
          issue-number: ${{ steps.find_pr.outputs.number }}
          body: |
            ## ${{ env.RESULT_EMOJI }} `tofu apply` output
            ```
            ${{ steps.apply.outputs.stdout }}
            ```
